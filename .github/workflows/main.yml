name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project and add my files
        run: |
          flutter create --org com.vista --project-name vista_control app
          mkdir -p app/assets
          cp main.dart app/lib/main.dart
          cp splash.jpg app/assets/splash.jpg
          cp pubspec.yaml app/pubspec.yaml
      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vista-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
