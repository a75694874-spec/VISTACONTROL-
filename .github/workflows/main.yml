name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Flutter project and add my files
        run: |
          flutter create --org com.vista --project-name vista_control app
          mkdir -p app/assets
          cp main.dart app/lib/main.dart
          cp splash.jpg app/assets/splash.jpg
          cp icon.png app/assets/icon.png
          cp pubspec.yaml app/pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="Vista Control"/' app/android/app/src/main/AndroidManifest.xml
      - name: Show code errors
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep " error • " | head -20 | sed 's/^ *//; s/^/::error::/' || true
      - name: Build release APK
        working-directory: app
        run: |
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: vista-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
